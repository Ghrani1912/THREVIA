# ═══════════════════════════════════════════════════════════════════════════════
# THREVIA — Docker Compose
# ═══════════════════════════════════════════════════════════════════════════════
#
# Profiles keep the long-running jobs out of a plain `docker compose up -d`, which
# starts only the infrastructure (HDFS + Spark + MongoDB):
#
#   docker compose up -d                                    # infra only
#   docker compose --profile phase4 up -d                   # + simulator + detector
#   docker compose --profile phase4 --profile phase6 up -d   # + dashboard (API)
#
# Host ports:
#   http://localhost:9870        HDFS NameNode UI
#   tcp://localhost:8020         HDFS RPC
#   http://localhost:8080        Spark Master UI
#   tcp://localhost:7077         Spark master RPC
#   mongodb://localhost:27018    MongoDB — mapped to 27018 on the host because 27017
#                                is commonly already taken by a host MongoDB.
#                                Containers reach it at mongodb:27017, which is what
#                                MONGO_URI is set to below. A host-side process
#                                (the API venv, mongosh, a script) must use 27018 or
#                                set MONGO_URI itself.
#   http://localhost:8000/dashboard  SOC dashboard (api service, profile phase6)
#   tcp://localhost:9999         Stream simulator listener (vestigial — see below)
#
# HOW PHASE 4 HANDS DATA OVER — this is a FILESYSTEM spool, not the socket:
# the simulator writes 1,000-row JSON batches to /tmp/threvia_stream and the
# detector reads that same directory with Spark's file source. The two services
# therefore mount the SAME `stream_spool` volume. Without it each container would
# have its own empty /tmp and the detector would tail nothing forever (the TCP
# listener on 9999 accepts a connection and closes it; it carries no rows).
#
# Models are read from HDFS (hdfs://namenode:8020/threvia/models_clean_v3), so the
# corpus and trained models must exist there before the detector can start. Build
# them with .\run_threvia_pipeline.ps1 (see README.md).
#
services:

  # ─────────────────────────────────────────
  # HADOOP — NameNode (master)
  # ─────────────────────────────────────────
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: threvia-namenode
    restart: unless-stopped
    ports:
      - "9870:9870"   # HDFS Web UI
      - "8020:8020"   # HDFS RPC
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./backend:/workspace/backend
    environment:
      - CLUSTER_NAME=threvia
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9870/"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - threvia-net

  # ─────────────────────────────────────────
  # HADOOP — DataNode (worker)
  # ─────────────────────────────────────────
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: threvia-datanode
    restart: unless-stopped
    volumes:
      - datanode_data:/hadoop/dfs/data
      - ./backend:/workspace/backend
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
      - CORE_CONF_hadoop_http_staticuser_user=root
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check=false
    depends_on:
      namenode:
        condition: service_healthy
    networks:
      - threvia-net

  # ─────────────────────────────────────────
  # SPARK — Master
  # ─────────────────────────────────────────
  spark-master:
    image: apache/spark:latest
    container_name: threvia-spark-master
    environment:
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./backend:/workspace/backend
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    networks:
      - threvia-net

  # ─────────────────────────────────────────
  # SPARK — Worker
  # ─────────────────────────────────────────
  spark-worker:
    image: apache/spark:latest
    container_name: threvia-spark-worker
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_MEMORY=3g
      - SPARK_WORKER_CORES=2
    volumes:
      - ./backend:/workspace/backend
      - spark_tmp:/tmp/spark
    depends_on:
      - spark-master
    deploy:
      resources:
        limits:
          memory: 4g
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    networks:
      - threvia-net

  # ─────────────────────────────────────────
  # PHASE 4 — Stream Simulator
  # Replays CIC-IDS-2017 Friday flows (the corpus the deployed models were trained
  # on, read from HDFS with pyspark) as a controlled-rate stream of 1,000-row JSON
  # batches written to the shared spool. Start this before streaming-detector.
  #
  # The image is the Spark one, not a bare python image: reading HDFS Parquet needs
  # pyspark AND a JVM, and the simulator holds ~350K rows in memory after that.
  # SPARK_MASTER=local[1] on purpose — this job is a single-threaded file writer, so
  # a cluster round-trip would only add executor/Python-version failure modes.
  # ─────────────────────────────────────────
  stream-simulator:
    image: apache/spark:latest
    container_name: threvia-stream-simulator
    restart: "no"
    working_dir: /workspace
    volumes:
      - ./backend:/workspace/backend
      - stream_spool:/tmp/threvia_stream
    environment:
      - STREAM_HOST=0.0.0.0
      - STREAM_PORT=9999         # vestigial TCP listener; the spool is the real channel
      - STREAM_RPS=200           # rows per second
      - STREAM_LOOP=1            # 1 = loop dataset forever
      - SPARK_MASTER=local[1]
      - PYTHONPATH=/workspace
    ports:
      - "9999:9999"
    depends_on:
      namenode:
        condition: service_healthy
    command: >
      bash -c "pip install pyspark==3.5.1 --quiet &&
               python backend/realtime/stream_simulator.py"
    networks:
      - threvia-net
    profiles:
      - phase4

  # ─────────────────────────────────────────
  # PHASE 4 — Streaming Detector
  # Reads the shared spool directory, runs three pipelines and writes alerts to
  # MongoDB: (A) Bloom Filter hits, (B) 60s windowed connection spikes, (C) ML
  # classification with the online-learning layer in front of the decision.
  # ─────────────────────────────────────────
  streaming-detector:
    image: apache/spark:latest
    container_name: threvia-streaming-detector
    restart: "no"
    working_dir: /workspace
    volumes:
      - ./backend:/workspace/backend
      - stream_spool:/tmp/threvia_stream
      # The learned state is checkpointed here rather than in the container's /tmp,
      # so a `docker compose up` recreates the container without resetting what the
      # adaptive layer has learned. Human verdicts live in MongoDB (mongo_data).
      - learning_state:/var/threvia
    environment:
      - STREAM_HOST=stream-simulator
      - STREAM_PORT=9999
      - SPARK_MASTER=local[2]
      - SPIKE_THRESHOLD=50
      - WINDOW_SECONDS=60
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB=threvia
      - PYTHONPATH=/workspace
      # Gate model. models_clean_v3 is the promoted gate: at the deployed
      # false-positive budget it matches v1 on Bot (60.2% vs 60.0% end-to-end)
      # and DDoS recall (99.9%) while lifting cross-environment DDoS recall on
      # CIC-DDoS2019 from 12.5% to 51.4% (ROC-AUC 0.49 -> 0.70).  Measured by
      # backend/ml/eval_bot_behind_gate.py.  Roll back with
      #   THREVIA_MODELS_DIR=hdfs://namenode:8020/threvia/models_clean
      # and re-point the threshold (thresholds.json / ML_THRESHOLD=0.65), because
      # the cut does not transfer between score scales: v3 at 0.65 detects 0 of
      # 570 held-out Bot flows.
      - THREVIA_MODELS_DIR=hdfs://namenode:8020/threvia/models_clean_v3
      - THREVIA_SHARED_DIR=hdfs://namenode:8020/threvia/models_clean
      # Pipeline C operating point. Intentionally unset: the detector resolves it
      # from backend/realtime/thresholds.json (generated by
      # backend/ml/calibrate_thresholds.py — currently 0.2575, derived for v3 on
      # the clean Friday BENIGN holdout at the deployed 3.65% FPR budget), then
      # these env vars, then its own defaults. Setting ML_THRESHOLD here
      # OVERRIDES the calibrated file, so only add it deliberately.
      # - ML_THRESHOLD=0.26
      # - BOT_THRESHOLD=0.50
      # - BOT_DEPLOY_PREVALENCE=0.05
      # - ML_ALERT_AGGREGATE=true
      # Optional: run a second detector against the same stream for A/B tests.
      # - CHECKPOINT_BASE=/tmp/threvia_checkpoint_b
      # - MAX_FILES_PER_TRIGGER=4
      #
      # ── Online / continual learning (backend/realtime/online_learning.py) ──
      # On by default. It holds the alert RATE at a budget by adapting the cut
      # inside a band around the calibrated value, and re-ranks scores with a
      # bounded residual learned from analyst verdicts + the stream's benign
      # majority. ONLINE_LEARNING=off runs the frozen operating point instead,
      # which is the matched A/B baseline.
      # - ONLINE_LEARNING=off
      - ONLINE_LEARNING_STATE=/var/threvia/learning_state.json
      # - ONLINE_LEARNING_TARGET_RATE=0.025   # alert-rate budget (fraction of flows)
      # - ONLINE_LEARNING_MAX_SHIFT=1.5       # cap on the log-odds residual
      # - ONLINE_LEARNING_CEILING=0.4931      # absolute cap on the adapted cut
      # - FEEDBACK_POLL_SECONDS=20           # how often analyst verdicts are read
      # - ONLINE_LEARNING_PRIME=/var/threvia/benign_scores.json  # seed the drift
      #     reference from the calibration holdout's benign scores instead of
      #     bootstrapping from the first observed batch
    depends_on:
      stream-simulator:
        condition: service_started
      mongodb:
        condition: service_healthy
    command: >
      bash -c "pip install pybloom-live==4.0.0 pymongo==4.7.2 pyspark==3.5.1 --quiet &&
               python backend/realtime/streaming_detector.py"
    networks:
      - threvia-net
    profiles:
      - phase4

  # ─────────────────────────────────────────
  # MONGODB — Processed events store
  # Collections: ml_alerts, stream_alerts, bloom_hits, nominal_flows,
  # manual_review, feedback, learning_telemetry, learning_state
  # (alert/nominal collections carry a 72h TTL; learning remains).
  # ─────────────────────────────────────────
  mongodb:
    image: mongo:6
    container_name: threvia-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"  # host 27018 → container 27017 (see the header note)
    environment:
      MONGO_INITDB_DATABASE: threvia
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - threvia-net

  # ─────────────────────────────────────────
  # PHASE 6 — Dashboard API (FastAPI)
  # Serves the SOC dashboard and every /api/v1 endpoint the page calls. Optional:
  # the same server runs on the host with backend/api/.venv (see README.md), which
  # is easier to iterate against. From compose it is reachable at
  # http://localhost:8000/dashboard and talks to MongoDB over the compose network.
  # ─────────────────────────────────────────
  api:
    image: python:3.11-slim
    container_name: threvia-api
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ./backend:/workspace/backend
      - ./dashboard:/workspace/dashboard
    environment:
      - MONGO_URI=mongodb://mongodb:27017/
      - MONGO_DB=threvia
      - PYTHONPATH=/workspace
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      bash -c "pip install --quiet -r backend/api/requirements.txt &&
               python backend/api/main.py"
    networks:
      - threvia-net
    profiles:
      - phase6

# ─────────────────────────────────────────
# VOLUMES
# ─────────────────────────────────────────
volumes:
  namenode_data:
  datanode_data:
  mongo_data:
  spark_tmp:
  # Shared by stream-simulator and streaming-detector — this IS the Phase 4 data
  # path. Deleting it stops the detector seeing new flows until the simulator
  # rewrites batches.
  stream_spool:
  # Checkpointed online-learning state for the detector.
  learning_state:

# ─────────────────────────────────────────
# NETWORK
# ─────────────────────────────────────────
networks:
  threvia-net:
    driver: bridge
